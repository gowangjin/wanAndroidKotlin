//apply plugin : 'org.jetbrains.kotlin.android'

android {
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        kapt {
            arguments {
                //根据模块名来命名路由根节点
                arg("AROUTER_MODULE_NAME", project.getName())
            }
        }
    }
    hilt{
        enableExperimentalClasspathAggregation = true
        enableAggregatingTask = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    dataBinding  {
        enabled = true
    }
}

dependencies {
    def nav_version = "2.5.3"
    def retrofit_version = "2.9.0"
    def hilt_version = "2.50"
    def glide_version = "4.16.0"
    def smart_refresh_layout_version = "2.0.6"
    def coroutines_version = "1.5.1"
    def ktx_version = "1.8.0"
    def flexbox_version = "3.0.0"
    def arouter_version = "1.5.2"
    def material_version = "1.8.0"

    //ARouter
    implementation "com.alibaba:arouter-api:$arouter_version"
    kapt "com.alibaba:arouter-compiler:$arouter_version"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.5.1'
    implementation platform('androidx.compose:compose-bom:2022.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    //Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    //BottomNavigationView
    implementation "com.google.android.material:material:$material_version"
    //retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    //retrofit的数据适配器，支持Gson、jackson、java8、scalar等等，也可以自定义
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    //retrofit的请求适配器，支持java8、rxjava1、rxjava2、rxjava3等等，也可以自定义
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofit_version"
    //hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"
    //glide
    implementation "com.github.bumptech.glide:glide:$glide_version"
    // 协程核心库
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    // 协程 Android 支持库
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    //viewModel 扩展
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$ktx_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation  "io.github.scwang90:refresh-layout-kernel:$smart_refresh_layout_version"      //核心必须依赖
    implementation  "io.github.scwang90:refresh-header-classics:$smart_refresh_layout_version"    //经典刷新头
    implementation  "io.github.scwang90:refresh-footer-classics:$smart_refresh_layout_version"    //经典加载
    implementation "com.google.android.flexbox:flexbox:$flexbox_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2022.10.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
kapt {
    correctErrorTypes true
}
